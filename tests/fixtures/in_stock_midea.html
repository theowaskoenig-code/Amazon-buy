<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Amazon.de</title></head>
<body>
  <span id="productTitle">Midea PortaSplit Mobile Klimaanlage ohne Abluftschlauch, 9000 BTU</span>

  <div id="corePriceDisplay_desktop_feature_div">
    <div class="a-price"><span class="a-offscreen">1.199,00&nbsp;€</span>
      <span class="a-price-whole">1.199<span class="a-price-fraction">00</span></span>
    </div>
  </div>

  <div id="availability"><span class="a-color-success">Auf Lager</span></div>

  <div id="merchant-info">Verkauf durch Midea und Versand durch Amazon.</div>
  <a id="sellerProfileTriggerId" href="#">Midea</a>

  <div id="variation_color_name">
    <ul>
      <li data-defaultasin="A1" class="selected">Weiß</li>
      <li data-defaultasin="A2">Schwarz</li>
    </ul>
  </div>

  <input id="add-to-cart-button" type="submit" value="In den Einkaufswagen">
  <input id="buy-now-button" type="submit" value="Jetzt kaufen">
</body>
</html>
